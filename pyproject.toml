[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aipipe"
version = "0.1.0"
description = "Fast utilities for AI agent workflows"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"

[project.scripts]
aipipe = "aipipe.__main__:_run"

[tool.setuptools.packages.find]
where = ["python"]
